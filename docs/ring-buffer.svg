<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Ring buffer with eight slots; the head index advances as producers claim slots and the tail index chases it as consumers drain them, wrapping around the end of the array">
  <title>BlitzQueue ring buffer: head and tail chasing each other</title>
  <text x="20" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8b949e">MpmcQueue ring buffer</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#8b949e">producers CAS head forward and publish seq = head + 1; consumers CAS tail forward and release the slot with seq = tail + Capacity</text>
  <rect x="60" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="62" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0.45;0;0" keyTimes="0.0000;0.3750;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="101" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 0</text>
  <text x="101" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 0</text>
  <rect x="150" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="152" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0.0000;0.1250;0.5000;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="191" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 1</text>
  <text x="191" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 1</text>
  <rect x="240" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="242" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0.0000;0.2500;0.6250;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="281" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 2</text>
  <text x="281" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 2</text>
  <rect x="330" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="332" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0.0000;0.3750;0.7500;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="371" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 3</text>
  <text x="371" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 3</text>
  <rect x="420" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="422" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0.0000;0.5000;0.8750;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="461" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 4</text>
  <text x="461" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 4</text>
  <rect x="510" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="512" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0.45;0;0" keyTimes="0.0000;0.6250;1.0000;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="551" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 5</text>
  <text x="551" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 5</text>
  <rect x="600" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="602" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0.45;0;0.45;0.45" keyTimes="0.0000;0.1250;0.7500;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="641" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 6</text>
  <text x="641" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 6</text>
  <rect x="690" y="150" width="82" height="68" rx="6" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <rect x="692" y="152" width="78" height="64" rx="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0.45;0;0.45;0.45" keyTimes="0.0000;0.2500;0.8750;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="731" y="178" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">slot 7</text>
  <text x="731" y="200" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">seq 7</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
  <path d="M772,264 C802,314 30,314 60,264" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/>
  <text x="440" y="330" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">index &amp; (Capacity - 1) wraps back to slot 0</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="101,128;191,128;281,128;371,128;461,128;551,128;641,128;731,128;731,128" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
    <path d="M-9,0 L9,0 L0,14 z" fill="#58a6ff"/>
    <text x="0" y="-10" font-family="sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">head (producers)</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="641,240;731,240;101,240;191,240;281,240;371,240;461,240;551,240;551,240" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" dur="8.0s" calcMode="discrete" repeatCount="indefinite"/>
    <path d="M-9,0 L9,0 L0,-14 z" fill="#d29922"/>
    <text x="0" y="26" font-family="sans-serif" font-size="13" fill="#d29922" text-anchor="middle">tail (consumers)</text>
  </g>
  <text x="20" y="365" font-family="sans-serif" font-size="13" fill="#3fb950">shaded slots hold published items: written by a producer, not yet claimed by a consumer</text>
  <text x="20" y="386" font-family="sans-serif" font-size="13" fill="#8b949e">head catching tail from behind means full (enqueue returns false); tail reaching head means empty (dequeue returns false)</text>
</svg>